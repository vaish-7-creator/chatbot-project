<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Basic Rule-Based Chatbot</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f4f4f4;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 16px;
}

.chat-container {
    width: 350px;
    height: 500px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.chat-header {
    background: #4a90e2;
    color: white;
    padding: 15px;
    text-align: center;
    font-size: 20px;
    font-weight: bold;
}

.chat-box {
    flex: 1;
    padding: 15px;
    overflow-y: auto;
    background: #fafafa;
}

.message {
    margin: 8px 0;
    padding: 10px;
    border-radius: 10px;
    max-width: 80%;
    word-wrap: break-word;
}

.user {
    background: #4a90e2;
    color: white;
    margin-left: auto;
}

.bot {
    background: #e5e5e5;
    color: black;
}

.chat-input {
    display: flex;
    border-top: 1px solid #ddd;
}

.chat-input input {
    flex: 1;
    padding: 12px;
    border: none;
    outline: none;
}

.chat-input button {
    padding: 12px 18px;
    border: none;
    background: #4a90e2;
    color: white;
    cursor: pointer;
}

.chat-input button:hover {
    background: #357abd;
}
</style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">Basic Rule-Based Chatbot</div>

    <div class="chat-box" id="chatBox">
        <div class="message bot">Hello! How can I help you?</div>
    </div>

    <div class="chat-input">
        <input type="text" id="userInput" placeholder="Type a message..." />
        <button id="sendButton" onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
async function sendMessage() {
    const input = document.getElementById("userInput");
    const sendButton = document.getElementById("sendButton");
    const text = input.value.trim();
    if (!text) return;

    const chatBox = document.getElementById("chatBox");
    addMessage(text, "user");
    input.value = "";
    sendButton.disabled = true;

    try {
        const response = await fetch("/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: text })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "The server could not process your message.");
        addMessage(data.reply, "bot");
    } catch (error) {
        addMessage("Unable to contact the chatbot server. Please try again.", "bot");
        console.error(error);
    } finally {
        sendButton.disabled = false;
        input.focus();
    }
}

function addMessage(text, sender) {
    const chatBox = document.getElementById("chatBox");
    const message = document.createElement("div");
    message.className = "message " + sender;
    message.textContent = text;
    chatBox.appendChild(message);
    chatBox.scrollTop = chatBox.scrollHeight;
}

document.getElementById("userInput").addEventListener("keydown", function(event) {
    if (event.key === "Enter") sendMessage();
});
</script>

</body>
</html>
